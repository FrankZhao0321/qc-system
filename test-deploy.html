<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #52c41a;
        }
        .success {
            background: #f6ffed;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #52c41a;
            margin: 20px 0;
        }
        .info {
            background: #e6f7ff;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #1890ff;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>✅ 部署测试成功！</h1>

    <div class="success">
        <h2>恭喜！</h2>
        <p>如果您能看到这个页面，说明部署是成功的。</p>
    </div>

    <div class="info">
        <h3>下一步：</h3>
        <p>请点击下方链接返回品控系统：</p>
        <a href="index.html" style="color: #1890ff; font-size: 18px;">打开品控系统</a>
    </div>

    <p style="color: #999; margin-top: 40px;">
        如果您能看到这个页面，说明服务器运行正常。<br>
        如果品控系统无法打开，可能是代码问题。
    </p>
</body>
</html>
