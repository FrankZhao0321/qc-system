<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断工具 - 奥领数控品控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .check-item.success {
            border-left: 4px solid #52c41a;
        }

        .check-item.error {
            border-left: 4px solid #ff4d4f;
        }

        .check-item.warning {
            border-left: 4px solid #faad14;
        }

        .check-item.pending {
            border-left: 4px solid #d9d9d9;
        }

        .check-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        .check-text {
            flex: 1;
        }

        .status {
            font-weight: 600;
            margin-left: 10px;
        }

        .status.success {
            color: #52c41a;
        }

        .status.error {
            color: #ff4d4f;
        }

        .status.warning {
            color: #faad14;
        }

        .code {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin: 10px 0;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #52c41a;
            margin-top: 5px;
        }

        .solution {
            margin-top: 15px;
            padding: 15px;
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 4px;
            display: none;
        }

        .solution h3 {
            color: #1890ff;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .solution ul {
            margin-left: 20px;
        }

        .solution li {
            margin-bottom: 8px;
        }

        .error-log {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 诊断工具</h1>
        <p class="subtitle">自动检测系统配置问题</p>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>正在诊断...</p>
        </div>

        <div class="section">
            <h2>1. Supabase 配置检查</h2>
            <div id="configCheck" class="check-item pending">
                <span class="check-icon">⏳</span>
                <span class="check-text">检查 Supabase 配置...</span>
            </div>
            <div id="configResult" class="solution">
                <h3>配置信息：</h3>
                <div class="code" id="configInfo"></div>
            </div>
        </div>

        <div class="section">
            <h2>2. Supabase 连接测试</h2>
            <div id="connectionCheck" class="check-item pending">
                <span class="check-icon">⏳</span>
                <span class="check-text">测试 Supabase 连接...</span>
            </div>
            <div id="connectionResult" class="solution">
                <h3>连接状态：</h3>
                <div id="connectionStatus"></div>
            </div>
        </div>

        <div class="section">
            <h2>3. 数据库表检查</h2>
            <div id="tableCheck" class="check-item pending">
                <span class="check-icon">⏳</span>
                <span class="check-text">检查数据库表...</span>
            </div>
            <div id="tableResult" class="solution">
                <h3>数据库表状态：</h3>
                <div id="tableStatus"></div>
            </div>
        </div>

        <div class="section">
            <h2>4. 数据加载测试</h2>
            <div id="dataCheck" class="check-item pending">
                <span class="check-icon">⏳</span>
                <span class="check-text">测试数据加载...</span>
            </div>
            <div id="dataResult" class="solution">
                <h3>数据加载状态：</h3>
                <div id="dataStatus"></div>
            </div>
        </div>

        <div class="section">
            <h2>5. 诊断结果</h2>
            <div id="diagnosisResult" class="solution">
                <h3>问题诊断：</h3>
                <div id="diagnosisText"></div>
                <h3>解决方案：</h3>
                <ul id="solutions"></ul>
            </div>
        </div>

        <button class="btn" onclick="runDiagnostics()">开始诊断</button>
        <button class="btn btn-secondary" onclick="window.open('index.html', '_blank')">打开品控系统</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabase = null;

        async function runDiagnostics() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            const results = {
                config: false,
                connection: false,
                tables: false,
                data: false
            };

            try {
                // 1. 检查配置
                const configCheck = document.getElementById('configCheck');
                const configResult = document.getElementById('configResult');
                
                try {
                    const scriptContent = await fetch('app-supabase.js').then(r => r.text());
                    const urlMatch = scriptContent.match(/SUPABASE_URL = '([^']+)'/);
                    const keyMatch = scriptContent.match(/SUPABASE_ANON_KEY = '([^']+)'/);
                    
                    if (urlMatch && keyMatch) {
                        const url = urlMatch[1];
                        const key = keyMatch[1];
                        
                        configCheck.className = 'check-item success';
                        configCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">Supabase 配置已找到</span>';
                        
                        configResult.style.display = 'block';
                        document.getElementById('configInfo').innerHTML = `
                            <strong>URL:</strong> ${url}<br>
                            <strong>Key:</strong> ${key.substring(0, 50)}...
                        `;
                        
                        // 创建 Supabase 客户端
                        if (window.supabase && window.supabase.createClient) {
                            supabase = window.supabase.createClient(url, key);
                            results.config = true;
                        } else {
                            throw new Error('Supabase 库未正确加载');
                        }
                    } else {
                        configCheck.className = 'check-item error';
                        configCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">未找到 Supabase 配置</span>';
                        
                        configResult.style.display = 'block';
                        document.getElementById('configInfo').innerHTML = '请在 app-supabase.js 中配置 Supabase URL 和 Key';
                    }
                } catch (error) {
                    configCheck.className = 'check-item error';
                    configCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">配置文件读取失败</span>';
                    
                    configResult.style.display = 'block';
                    document.getElementById('configInfo').innerHTML = `错误: ${error.message}`;
                }

                // 等待一下再继续
                await new Promise(resolve => setTimeout(resolve, 500));

                // 2. 测试连接
                if (supabase) {
                    const connectionCheck = document.getElementById('connectionCheck');
                    const connectionResult = document.getElementById('connectionResult');
                    
                    try {
                        // 尝试查询设备表
                        const { data, error } = await supabase
                            .from('devices')
                            .select('count')
                            .limit(1);
                        
                        if (error) {
                            connectionCheck.className = 'check-item error';
                            connectionCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">Supabase 连接失败</span>';
                            
                            connectionResult.style.display = 'block';
                            document.getElementById('connectionStatus').innerHTML = `
                                <span class="status error">连接失败</span><br>
                                <strong>错误信息:</strong> ${error.message}<br>
                                <strong>错误代码:</strong> ${error.code || '未知'}
                            `;
                        } else {
                            connectionCheck.className = 'check-item success';
                            connectionCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">Supabase 连接成功</span>';
                            
                            connectionResult.style.display = 'block';
                            document.getElementById('connectionStatus').innerHTML = '<span class="status success">连接正常</span>';
                            results.connection = true;
                        }
                    } catch (error) {
                        connectionCheck.className = 'check-item error';
                        connectionCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">连接测试失败</span>';
                        
                        connectionResult.style.display = 'block';
                        document.getElementById('connectionStatus').innerHTML = `
                            <span class="status error">测试失败</span><br>
                            <strong>错误:</strong> ${error.message}
                        `;
                    }
                }

                await new Promise(resolve => setTimeout(resolve, 500));

                // 3. 检查数据库表
                if (supabase && results.connection) {
                    const tableCheck = document.getElementById('tableCheck');
                    const tableResult = document.getElementById('tableResult');
                    
                    try {
                        const { data, error } = await supabase
                            .from('devices')
                            .select('*')
                            .limit(1);
                        
                        if (error) {
                            if (error.code === '42P01') {
                                tableCheck.className = 'check-item error';
                                tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据库表不存在</span>';
                                
                                tableResult.style.display = 'block';
                                document.getElementById('tableStatus').innerHTML = `
                                    <span class="status error">表未创建</span><br>
                                    <strong>错误:</strong> devices 表不存在<br>
                                    <strong>解决方法:</strong> 请在 Supabase SQL Editor 中执行 database.sql 文件中的 SQL 代码
                                `;
                            } else {
                                tableCheck.className = 'check-item error';
                                tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据库查询失败</span>';
                                
                                tableResult.style.display = 'block';
                                document.getElementById('tableStatus').innerHTML = `
                                    <span class="status error">查询失败</span><br>
                                    <strong>错误:</strong> ${error.message}
                                `;
                            }
                        } else {
                            tableCheck.className = 'check-item success';
                            tableCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">数据库表存在</span>';
                            
                            tableResult.style.display = 'block';
                            document.getElementById('tableStatus').innerHTML = `
                                <span class="status success">表正常</span><br>
                                <strong>设备数量:</strong> ${data ? data.length : 0}
                            `;
                            results.tables = true;
                        }
                    } catch (error) {
                        tableCheck.className = 'check-item error';
                        tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">表检查失败</span>';
                        
                        tableResult.style.display = 'block';
                        document.getElementById('tableStatus').innerHTML = `
                            <span class="status error">检查失败</span><br>
                            <strong>错误:</strong> ${error.message}
                        `;
                    }
                }

                await new Promise(resolve => setTimeout(resolve, 500));

                // 4. 测试数据加载
                if (supabase && results.tables) {
                    const dataCheck = document.getElementById('dataCheck');
                    const dataResult = document.getElementById('dataResult');
                    
                    try {
                        const { data, error } = await supabase
                            .from('devices')
                            .select('*')
                            .order('created_at', { ascending: false });
                        
                        if (error) {
                            dataCheck.className = 'check-item error';
                            dataCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据加载失败</span>';
                            
                            dataResult.style.display = 'block';
                            document.getElementById('dataStatus').innerHTML = `
                                <span class="status error">加载失败</span><br>
                                <strong>错误:</strong> ${error.message}
                            `;
                        } else {
                            const deviceCount = data ? data.length : 0;
                            
                            if (deviceCount === 0) {
                                dataCheck.className = 'check-item warning';
                                dataCheck.innerHTML = '<span class="check-icon">⚠️</span><span class="check-text">数据库中没有设备数据</span>';
                                
                                dataResult.style.display = 'block';
                                document.getElementById('dataStatus').innerHTML = `
                                    <span class="status warning">无数据</span><br>
                                    <strong>设备数量:</strong> ${deviceCount}<br>
                                    <strong>说明:</strong> 数据库表已创建，但还没有数据<br>
                                    <strong>解决方法:</strong> 系统应该会自动创建测试数据，如果没有，请手动插入测试数据
                                `;
                            } else {
                                dataCheck.className = 'check-item success';
                                dataCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">数据加载成功</span>';
                                
                                dataResult.style.display = 'block';
                                document.getElementById('dataStatus').innerHTML = `
                                    <span class="status success">加载成功</span><br>
                                    <strong>设备数量:</strong> ${deviceCount}<br>
                                    <strong>状态:</strong> 正常
                                `;
                                results.data = true;
                            }
                        }
                    } catch (error) {
                        dataCheck.className = 'check-item error';
                        dataCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据加载测试失败</span>';
                        
                        dataResult.style.display = 'block';
                        document.getElementById('dataStatus').innerHTML = `
                            <span class="status error">测试失败</span><br>
                            <strong>错误:</strong> ${error.message}
                        `;
                    }
                }

                // 5. 显示诊断结果
                const diagnosisResult = document.getElementById('diagnosisResult');
                const diagnosisText = document.getElementById('diagnosisText');
                const solutions = document.getElementById('solutions');
                
                diagnosisResult.style.display = 'block';
                
                if (results.config && results.connection && results.tables && results.data) {
                    diagnosisText.innerHTML = '<span class="status success">✅ 所有检查通过，系统配置正常</span>';
                    solutions.innerHTML = '<li>系统应该可以正常使用</li><li>如果还是看不到设备，请刷新浏览器页面</li><li>清除浏览器缓存后重试</li><li>按 Cmd+Shift+R (Mac) 或 Ctrl+Shift+R (Windows) 强制刷新</li>';
                } else if (!results.config) {
                    diagnosisText.innerHTML = '<span class="status error">❌ Supabase 配置未找到</span>';
                    solutions.innerHTML = '<li>检查 app-supabase.js 文件是否存在</li><li>确认 SUPABASE_URL 和 SUPABASE_ANON_KEY 已正确配置</li><li>运行自动配置脚本重新配置</li>';
                } else if (!results.connection) {
                    diagnosisText.innerHTML = '<span class="status error">❌ 无法连接到 Supabase</span>';
                    solutions.innerHTML = '<li>检查网络连接</li><li>确认 Supabase URL 是否正确</li><li>检查 Supabase 项目状态</li><li>确认 API Key 是否有效</li><li>尝试在浏览器中直接访问 Supabase Dashboard</li>';
                } else if (!results.tables) {
                    diagnosisText.innerHTML = '<span class="status error">❌ 数据库表不存在</span>';
                    solutions.innerHTML = '<li>登录 Supabase Dashboard</li><li>打开 SQL Editor</li><li>执行 database.sql 文件中的 SQL 代码</li><li>等待执行完成</li><li>刷新浏览器页面</li>';
                } else if (!results.data) {
                    diagnosisText.innerHTML = '<span class="status warning">⚠️ 数据库中没有设备数据</span>';
                    solutions.innerHTML = '<li>检查 SQL 是否执行成功</li><li>确认测试数据是否插入</li><li>手动在 Supabase SQL Editor 中插入测试数据</li><li>刷新浏览器页面</li>';
                }

            } catch (error) {
                console.error('诊断过程出错:', error);
                const diagnosisResult = document.getElementById('diagnosisResult');
                const diagnosisText = document.getElementById('diagnosisText');
                const solutions = document.getElementById('solutions');
                
                diagnosisResult.style.display = 'block';
                diagnosisText.innerHTML = '<span class="status error">❌ 诊断过程出错</span>';
                solutions.innerHTML = '<li>错误信息: ' + error.message + '</li><li>请刷新页面重试</li><li>检查浏览器控制台是否有其他错误</li>';
            }

            loading.style.display = 'none';
        }

        // 页面加载完成后自动运行诊断
        window.addEventListener('load', function() {
            setTimeout(function() {
                console.log('页面加载完成，准备运行诊断');
                runDiagnostics();
            }, 1000);
        });
    </script>
</body>
</html>
