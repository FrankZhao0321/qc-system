<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统诊断</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            margin-bottom: 20px;
        }
        .test-item {
            margin: 15px 0;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #ccc;
        }
        .test-item.pending {
            background: #f5f5f5;
            border-left-color: #ccc;
        }
        .test-item.running {
            background: #e6f7ff;
            border-left-color: #1890ff;
        }
        .test-item.success {
            background: #f6ffed;
            border-left-color: #52c41a;
        }
        .test-item.error {
            background: #fff2f0;
            border-left-color: #ff4d4f;
        }
        .test-title {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .test-detail {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .error-message {
            color: #ff4d4f;
            font-family: monospace;
            background: #fff1f0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            word-break: break-all;
        }
        .button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        .button:hover {
            background: #40a9ff;
        }
        .data-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .data-item {
            padding: 8px;
            background: white;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 系统诊断工具</h1>
        <p>点击下方按钮开始诊断系统问题：</p>
        <button class="button" onclick="runDiagnostics()">开始诊断</button>
        
        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cjlppzltsaroblzqutra.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbHBwemx0c2Fyb2JsenF1dHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTY4NDcsImV4cCI6MjA4Nzg5Mjg0N30.jWZM-TnRR-8VHSdO3vvWTmlRMzEargQUS7tE7d9-IrI';
        
        let supabase;
        
        function createTestItem(title, status = 'pending', detail = '', error = '') {
            return `
                <div class="test-item ${status}">
                    <div class="test-title">${title}</div>
                    ${detail ? `<div class="test-detail">${detail}</div>` : ''}
                    ${error ? `<div class="error-message">${error}</div>` : ''}
                </div>
            `;
        }
        
        function updateResults(html) {
            document.getElementById('results').innerHTML = html;
        }
        
        async function runDiagnostics() {
            let results = '';
            
            // 测试 1: Supabase 配置
            results += createTestItem('1. 检查 Supabase 配置', 'running');
            updateResults(results);
            
            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                    throw new Error('Supabase URL 或 Key 未配置');
                }
                
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                results = results.replace(
                    createTestItem('1. 检查 Supabase 配置', 'running'),
                    createTestItem('1. 检查 Supabase 配置', 'success', 'Supabase 客户端初始化成功')
                );
            } catch (error) {
                results = results.replace(
                    createTestItem('1. 检查 Supabase 配置', 'running'),
                    createTestItem('1. 检查 Supabase 配置', 'error', '', error.message)
                );
                updateResults(results);
                return;
            }
            updateResults(results);
            
            // 测试 2: 连接 Supabase
            results += createTestItem('2. 测试 Supabase 连接', 'running');
            updateResults(results);
            
            try {
                const { data, error } = await supabase.from('devices').select('count', { count: 'exact', head: true });
                
                if (error) {
                    throw error;
                }
                
                results = results.replace(
                    createTestItem('2. 测试 Supabase 连接', 'running'),
                    createTestItem('2. 测试 Supabase 连接', 'success', '连接成功')
                );
            } catch (error) {
                results = results.replace(
                    createTestItem('2. 测试 Supabase 连接', 'running'),
                    createTestItem('2. 测试 Supabase 连接', 'error', '', `错误代码: ${error.code}, 消息: ${error.message}`)
                );
                updateResults(results);
                
                if (error.code === '42P01') {
                    results += createTestItem('⚠️ 诊断结果', 'error', '', '数据库表不存在！您需要在 Supabase SQL Editor 中执行 database.sql 脚本来创建表。');
                    updateResults(results);
                }
                return;
            }
            updateResults(results);
            
            // 测试 3: 查询设备数据
            results += createTestItem('3. 查询设备数据', 'running');
            updateResults(results);
            
            try {
                const { data: devices, error } = await supabase
                    .from('devices')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw error;
                }
                
                if (!devices || devices.length === 0) {
                    results = results.replace(
                        createTestItem('3. 查询设备数据', 'running'),
                        createTestItem('3. 查询设备数据', 'success', '查询成功，但没有设备数据', '数据库中没有设备，请添加设备或检查测试数据是否插入成功')
                    );
                } else {
                    let deviceList = devices.map(d => 
                        `<div class="data-item"><strong>${d.device_number}</strong> - ${d.model} - ${d.customer} (${d.status})</div>`
                    ).join('');
                    
                    results = results.replace(
                        createTestItem('3. 查询设备数据', 'running'),
                        createTestItem('3. 查询设备数据', 'success', `查询成功，找到 ${devices.length} 个设备`, `<div class="data-display">${deviceList}</div>`)
                    );
                }
            } catch (error) {
                results = results.replace(
                    createTestItem('3. 查询设备数据', 'running'),
                    createTestItem('3. 查询设备数据', 'error', '', error.message)
                );
            }
            updateResults(results);
            
            // 测试 4: 检查其他表
            const tables = ['assembly_checks', 'test_reports', 'shipping_checks', 'customer_feedback', 'improvement_suggestions'];
            let tableResults = '';
            
            for (const table of tables) {
                try {
                    const { data, error } = await supabase.from(table).select('count', { count: 'exact', head: true });
                    if (error) throw error;
                    tableResults += `<div class="data-item">✓ ${table}: ${data || 0} 条记录</div>`;
                } catch (error) {
                    tableResults += `<div class="data-item" style="color: #ff4d4f;">✗ ${table}: ${error.message}</div>`;
                }
            }
            
            results += createTestItem('4. 检查其他数据表', 'success', '所有表检查完成', `<div class="data-display">${tableResults}</div>`);
            updateResults(results);
            
            // 最终建议
            results += createTestItem('✅ 诊断完成', 'success', '所有测试已完成', '如果所有测试都通过，请尝试刷新 index.html 页面。如果仍有问题，请检查浏览器控制台（按 F12）查看详细错误信息。');
            updateResults(results);
        }
    </script>
</body>
</html>
