<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 - 奥领数控品控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .check-item.success {
            border-left: 4px solid #52c41a;
        }

        .check-item.error {
            border-left: 4px solid #ff4d4f;
        }

        .check-item.warning {
            border-left: 4px solid #faad14;
        }

        .check-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        .check-text {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #52c41a;
            margin-top: 5px;
        }

        .code-block {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin: 10px 0;
            word-break: break-all;
        }

        .info-box {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
        }

        .error-box {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 配置检查</h1>
        <p class="subtitle">检查哪些步骤还没有完成</p>

        <div class="section">
            <h2>1. Supabase 配置</h2>
            <div id="configCheck" class="check-item">
                <span class="check-icon">⏳</span>
                <span class="check-text">检查配置文件...</span>
            </div>
        </div>

        <div class="section">
            <h2>2. 数据库表创建</h2>
            <div id="tableCheck" class="check-item">
                <span class="check-icon">⏳</span>
                <span class="check-text">检查数据库表...</span>
            </div>
        </div>

        <div class="section">
            <h2>3. 测试数据插入</h2>
            <div id="dataCheck" class="check-item">
                <span class="check-icon">⏳</span>
                <span class="check-text">检查测试数据...</span>
            </div>
        </div>

        <div class="section">
            <h2>4. 系统连接测试</h2>
            <div id="connectionCheck" class="check-item">
                <span class="check-icon">⏳</span>
                <span class="check-text">测试系统连接...</span>
            </div>
        </div>

        <div id="result" class="section" style="display: none;">
            <h2>检查结果</h2>
            <div id="resultContent"></div>
        </div>

        <button class="btn" onclick="checkAll()">开始检查</button>
        <button class="btn btn-secondary" onclick="window.open('index.html', '_blank')">打开主系统</button>
    </div>

    <script>
        async function checkAll() {
            const configCheck = document.getElementById('configCheck');
            const tableCheck = document.getElementById('tableCheck');
            const dataCheck = document.getElementById('dataCheck');
            const connectionCheck = document.getElementById('connectionCheck');
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');

            result.style.display = 'block';
            resultContent.innerHTML = '<p>正在检查...</p>';

            try {
                let results = {
                    config: false,
                    tables: false,
                    data: false,
                    connection: false
                };

                let html = '';

                // 1. 检查配置
                try {
                    const response = await fetch('app-supabase.js');
                    const content = await response.text();
                    
                    if (content.includes('YOUR_SUPABASE_URL') || content.includes('YOUR_SUPABASE_ANON_KEY')) {
                        configCheck.className = 'check-item error';
                        configCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">配置未完成</span>';
                        html += '<div class="error-box">❌ <strong>配置未完成</strong><br>请在 app-supabase.js 中配置 Supabase URL 和 Key</div>';
                    } else {
                        configCheck.className = 'check-item success';
                        configCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">配置已完成</span>';
                        results.config = true;
                    }
                } catch (error) {
                    configCheck.className = 'check-item error';
                    configCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">配置文件读取失败</span>';
                    html += '<div class="error-box">❌ <strong>配置文件读取失败</strong><br>' + error.message + '</div>';
                }

                // 2. 检查数据库表
                if (results.config) {
                    try {
                        const response = await fetch('app-supabase.js');
                        const content = await response.text();
                        
                        const urlMatch = content.match(/SUPABASE_URL = '([^']+)'/);
                        const keyMatch = content.match(/SUPABASE_ANON_KEY = '([^']+)'/);
                        
                        if (!urlMatch || !keyMatch) {
                            tableCheck.className = 'check-item error';
                            tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">配置格式错误</span>';
                            html += '<div class="error-box">❌ <strong>配置格式错误</strong></div>';
                        } else {
                            const url = urlMatch[1];
                            const key = keyMatch[1];
                            
                            // 使用 fetch 直接测试
                            const testUrl = url + '/rest/v1/devices?select=count';
                            const testResponse = await fetch(testUrl, {
                                headers: {
                                    'apikey': key,
                                    'Content-Type': 'application/json'
                                }
                            });
                            
                            if (testResponse.ok) {
                                tableCheck.className = 'check-item success';
                                tableCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">数据库表已创建</span>';
                                results.tables = true;
                            } else {
                                tableCheck.className = 'check-item error';
                                tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据库表不存在</span>';
                                html += '<div class="error-box">❌ <strong>数据库表不存在</strong><br>解决方法：<br>1. 打开 Supabase SQL Editor<br>2. 执行 database.sql 文件中的 SQL 代码</div>';
                            }
                        }
                    } catch (error) {
                        tableCheck.className = 'check-item error';
                        tableCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">表检查失败</span>';
                        html += '<div class="error-box">❌ <strong>表检查失败</strong><br>' + error.message + '</div>';
                    }
                } else {
                    tableCheck.className = 'check-item warning';
                    tableCheck.innerHTML = '<span class="check-icon">⚠️</span><span class="check-text">请先完成配置</span>';
                }

                // 3. 检查测试数据
                if (results.config && results.tables) {
                    try {
                        const response = await fetch('app-supabase.js');
                        const content = await response.text();
                        
                        const urlMatch = content.match(/SUPABASE_URL = '([^']+)'/);
                        const keyMatch = content.match(/SUPABASE_ANON_KEY = '([^']+)'/);
                        
                        if (!urlMatch || !keyMatch) {
                            dataCheck.className = 'check-item error';
                            dataCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">配置格式错误</span>';
                        } else {
                            const url = urlMatch[1];
                            const key = keyMatch[1];
                            
                            const testUrl = url + '/rest/v1/devices?select=count&limit=1';
                            const testResponse = await fetch(testUrl, {
                                headers: {
                                    'apikey': key,
                                    'Content-Type': 'application/json'
                                }
                            });
                            
                            if (testResponse.ok) {
                                const data = await testResponse.json();
                                const count = Array.isArray(data) ? data.length : (data.count || 0);
                                
                                if (count > 0) {
                                    dataCheck.className = 'check-item success';
                                    dataCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">测试数据已存在</span>';
                                    results.data = true;
                                } else {
                                    dataCheck.className = 'check-item error';
                                    dataCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">没有测试数据</span>';
                                    html += '<div class="error-box">❌ <strong>没有测试数据</strong><br>解决方法：<br>在 Supabase SQL Editor 中执行以下 SQL：<br><br><div class="code-block">INSERT INTO devices (device_number, model, customer, order_number, status)<br>VALUES<br>  (&apos;CNC-2024-001&apos;, &apos;XK7132&apos;, &apos;华东机械制造有限公司&apos;, &apos;ORDER-2024-001&apos;, &apos;assembling&apos;),<br>  (&apos;CNC-2024-002&apos;, &apos;XK7140&apos;, &apos;北方精密仪器厂&apos;, &apos;ORDER-2024-002&apos;, &apos;testing&apos;),<br>  (&apos;CNC-2024-003&apos;, &apos;XK7132&apos;, &apos;南方汽车零部件公司&apos;, &apos;ORDER-2024-003&apos;, &apos;shipping&apos;);</div>';
                                }
                            }
                        }
                    } catch (error) {
                        dataCheck.className = 'check-item error';
                        dataCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">数据检查失败</span>';
                        html += '<div class="error-box">❌ <strong>数据检查失败</strong><br>' + error.message + '</div>';
                    }
                } else {
                    dataCheck.className = 'check-item warning';
                    dataCheck.innerHTML = '<span class="check-icon">⚠️</span><span class="check-text">请先完成前面的步骤</span>';
                }

                // 4. 系统连接测试
                if (results.config && results.tables && results.data) {
                    connectionCheck.className = 'check-item success';
                    connectionCheck.innerHTML = '<span class="check-icon">✅</span><span class="check-text">系统连接正常</span>';
                    results.connection = true;
                } else {
                    connectionCheck.className = 'check-item error';
                    connectionCheck.innerHTML = '<span class="check-icon">❌</span><span class="check-text">系统连接失败</span>';
                }

                // 显示结果
                if (results.config && results.tables && results.data && results.connection) {
                    html += '<div class="info-box">✅ <strong>所有检查通过！</strong><br><br>现在可以：<br>1. 点击"打开主系统"按钮<br>2. 或直接打开 index.html<br>3. 开始使用品控系统</div>';
                } else {
                    html += '<div class="error-box">⚠️ <strong>还有步骤未完成</strong><br><br>请按照上面的错误提示完成相应步骤后，再次点击"开始检查"</div>';
                }

                resultContent.innerHTML = html;

            } catch (error) {
                resultContent.innerHTML = '<div class="error-box">❌ <strong>检查过程出错</strong><br>' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
