<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .info {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .device-list {
            margin-top: 20px;
        }
        .device-item {
            background: #fafafa;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            border-left: 4px solid #1890ff;
        }
        .device-number {
            font-size: 18px;
            font-weight: bold;
            color: #1890ff;
        }
        .device-details {
            margin-top: 8px;
            color: #666;
        }
        .button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        .button:hover {
            background: #40a9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 系统测试页面</h1>
        
        <div id="status"></div>
        <div id="deviceList" class="device-list"></div>
        
        <button class="button" onclick="testSystem()">重新测试</button>
        <br><br>
        <a href="index.html" style="color: #1890ff;">返回主页面</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cjlppzltsaroblzqutra.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbHBwemx0c2Fyb2JsenF1dHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTY4NDcsImV4cCI6MjA4Nzg5Mjg0N30.jWZM-TnRR-8VHSdO3vvWTmlRMzEargQUS7tE7d9-IrI';
        
        async function testSystem() {
            const statusDiv = document.getElementById('status');
            const deviceListDiv = document.getElementById('deviceList');
            
            statusDiv.innerHTML = '<div class="info">正在测试系统...</div>';
            deviceListDiv.innerHTML = '';
            
            try {
                // 测试 1: 初始化 Supabase
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                statusDiv.innerHTML += '<div class="success">✓ Supabase 客户端初始化成功</div>';
                
                // 测试 2: 查询设备
                const { data, error } = await supabase
                    .from('devices')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw error;
                }
                
                statusDiv.innerHTML += '<div class="success">✓ 数据库查询成功</div>';
                
                if (!data || data.length === 0) {
                    statusDiv.innerHTML += '<div class="error">✗ 数据库中没有设备数据</div>';
                    statusDiv.innerHTML += '<div class="info">提示：请在 Supabase SQL Editor 中执行 database.sql 脚本</div>';
                } else {
                    statusDiv.innerHTML += `<div class="success">✓ 找到 ${data.length} 个设备</div>`;
                    
                    deviceListDiv.innerHTML = '<h2>设备列表：</h2>' + data.map(device => `
                        <div class="device-item">
                            <div class="device-number">${device.device_number}</div>
                            <div class="device-details">
                                型号：${device.model}<br>
                                客户：${device.customer}<br>
                                订单号：${device.order_number}<br>
                                状态：${device.status}
                            </div>
                        </div>
                    `).join('');
                }
                
                statusDiv.innerHTML += '<div class="success">✓ 系统测试完成！</div>';
                statusDiv.innerHTML += '<div class="info">如果看到设备列表，说明系统正常工作。请点击上方链接返回主页面。</div>';
                
            } catch (error) {
                statusDiv.innerHTML += '<div class="error">✗ 测试失败</div>';
                statusDiv.innerHTML += `<div class="error">错误信息：${error.message}</div>`;
                statusDiv.innerHTML += `<div class="error">错误代码：${error.code || '未知'}</div>`;
                
                if (error.code === '42P01') {
                    statusDiv.innerHTML += '<div class="info">⚠️ 数据库表不存在！</div>';
                    statusDiv.innerHTML += '<div class="info">解决方法：请在 Supabase SQL Editor 中执行 database.sql 脚本创建表</div>';
                }
            }
        }
        
        // 页面加载时自动测试
        document.addEventListener('DOMContentLoaded', testSystem);
    </script>
</body>
</html>
