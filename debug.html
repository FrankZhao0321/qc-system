<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
        }
        .test-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .info {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>系统测试</h1>
        
        <div id="test1" class="test-item info">测试 1: 检查 JavaScript...</div>
        <div id="test2" class="test-item info">测试 2: 检查 Supabase 库...</div>
        <div id="test3" class="test-item info">测试 3: 连接 Supabase...</div>
        <div id="test4" class="test-item info">测试 4: 查询数据库...</div>
        
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        // 测试 1: JavaScript 是否工作
        document.getElementById('test1').className = 'test-item success';
        document.getElementById('test1').innerHTML = '✓ 测试 1: JavaScript 正常工作';
        
        // 等待 Supabase 库加载
        window.addEventListener('load', async function() {
            try {
                // 测试 2: 检查 Supabase 库
                if (typeof window.supabase === 'undefined') {
                    throw new Error('Supabase 库未加载');
                }
                document.getElementById('test2').className = 'test-item success';
                document.getElementById('test2').innerHTML = '✓ 测试 2: Supabase 库已加载';
                
                // 测试 3: 连接 Supabase
                const SUPABASE_URL = 'https://cjlppzltsaroblzqutra.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbHBwemx0c2Fyb2JsenF1dHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTY4NDcsImV4cCI6MjA4Nzg5Mjg0N30.jWZM-TnRR-8VHSdO3vvWTmlRMzEargQUS7tE7d9-IrI';
                
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById('test3').className = 'test-item success';
                document.getElementById('test3').innerHTML = '✓ 测试 3: Supabase 连接成功';
                
                // 测试 4: 查询数据库
                const { data, error } = await supabase
                    .from('devices')
                    .select('count', { count: 'exact', head: true });
                
                if (error) {
                    throw error;
                }
                
                document.getElementById('test4').className = 'test-item success';
                document.getElementById('test4').innerHTML = '✓ 测试 4: 数据库查询成功，找到 ' + (data || 0) + ' 个设备';
                
                document.getElementById('result').innerHTML = '<div class="test-item success"><strong>🎉 所有测试通过！系统工作正常。</strong></div>';
                
            } catch (error) {
                console.error('错误:', error);
                document.getElementById('result').innerHTML = '<div class="test-item error"><strong>✗ 错误：</strong>' + error.message + '</div>';
                
                if (error.code === '42P01') {
                    document.getElementById('result').innerHTML += '<div class="test-item error"><strong>提示：</strong>数据库表不存在，请在 Supabase SQL Editor 中执行 database.sql 脚本</div>';
                }
            }
        });
    </script>
</body>
</html>
