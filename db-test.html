<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
        }
        .status {
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .info {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数据库连接测试</h1>
        
        <div id="status" class="status info">正在测试数据库连接...</div>
        
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cjlppzltsaroblzqutra.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbHBwemx0c2Fyb2JsenF1dHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTY4NDcsImV4cCI6MjA4Nzg5Mjg0N30.jWZM-TnRR-8VHSdO3vvWTmlRMzEargQUS7tE7d9-IrI';
        
        async function testConnection() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            try {
                // 测试 1: 创建客户端
                if (typeof window.supabase === 'undefined') {
                    throw new Error('Supabase 库未加载');
                }
                
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✓ Supabase 客户端创建成功';
                
                // 测试 2: 查询设备数量
                const { data, error } = await supabase
                    .from('devices')
                    .select('count', { count: 'exact', head: true });
                
                if (error) {
                    throw error;
                }
                
                statusDiv.innerHTML = '✓ 数据库连接成功！';
                
                // 测试 3: 显示结果
                if (data === 0) {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <strong>⚠️ 数据库中没有设备数据</strong><br><br>
                            请在 Supabase SQL Editor 中执行 database.sql 脚本<br><br>
                            <a href="https://supabase.com/dashboard/project/cjlppzltsaroblzqutra/sql/new" target="_blank" style="color: #1890ff;">打开 SQL Editor</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <strong>✅ 数据库正常！找到 ${data} 个设备</strong><br><br>
                            请刷新主页面查看设备列表
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('错误:', error);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '✗ 数据库连接失败';
                
                resultDiv.innerHTML = `
                    <div class="status error">
                        <strong>错误信息：</strong>${error.message}<br><br>
                        <strong>错误代码：</strong>${error.code || '未知'}<br><br>
                        ${error.code === '42P01' ? 
                            '<strong>解决方法：</strong>数据库表不存在，请在 Supabase SQL Editor 中执行 database.sql 脚本<br><br>' +
                            '<a href="https://supabase.com/dashboard/project/cjlppzltsaroblzqutra/sql/new" target="_blank" style="color: #1890ff;">打开 SQL Editor</a>' : 
                            '<strong>解决方法：</strong>请检查网络连接和 Supabase 配置'}
                    </div>
                `;
            }
        }
        
        // 页面加载完成后执行测试
        document.addEventListener('DOMContentLoaded', testConnection);
    </script>
</body>
</html>
